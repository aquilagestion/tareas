<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tareas realizadas — GREFA Tareas</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <style>
    .warn-box { color:#92400e;background:#fffbeb;border:1px solid #fde68a;padding:0.5rem 0.65rem;border-radius:6px;font-size:0.85rem;margin:0.5rem 0 0; }
    .notes-box { background:#f5f5f4;border-radius:6px;padding:0.5rem 0.65rem;font-size:0.85rem;margin:0.5rem 0 0; }
  </style>
</head>
<body>
  <div id="nav"></div>
  <main class="container container-wide stack">
    <div>
      <h1 class="h1" style="font-size:1.75rem">Tareas realizadas</h1>
      <p class="muted">Historial de tareas que has marcado como hechas. Pulsa una para ver el detalle completo.</p>
      <p class="small muted" id="versionLine"></p>
    </div>
    <p id="err" class="alert" style="display:none"></p>
    <div id="list" class="stack"></div>
  </main>

  <div id="detModal" class="modal-backdrop" hidden>
    <div class="modal" style="max-width:34rem">
      <div id="detBody"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-primary" id="btnDetClose">Cerrar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAdmin, renderNav, logout, showError, escapeHtml, $ } from "/js/admin.js";
    import { APP_VERSION } from "/js/version.js";
    import { subscribeMyLogs, formatStamp, formatLogScheduled } from "/js/my-tasks.js";

    const { profile } = await requireAdmin();
    $("nav").innerHTML = renderNav("", profile.fullName);
    $("btnLogout").onclick = () => logout();
    $("versionLine").textContent = `Versión ${APP_VERSION}`;

    let logs = [];

    function statusBadge(log) {
      return log.audited
        ? `<span class="badge badge-green">Chequeada por responsable</span>`
        : `<span class="badge badge-amber">Pendiente de chequeo</span>`;
    }

    function render() {
      if (!logs.length) {
        $("list").innerHTML = `<div class="card muted" style="text-align:center;border-style:dashed">
          Aún no has marcado ninguna tarea como hecha.
        </div>`;
        return;
      }
      $("list").innerHTML = logs
        .map((l) => {
          const material = String(l.materialShortage || "").trim();
          return `<article class="card" data-id="${l.id}" style="cursor:pointer">
            <h2 class="h2" style="margin:0">${escapeHtml(l.taskTitle || "")}</h2>
            <p class="small muted" style="margin:0.2rem 0 0">Programada: ${escapeHtml(formatLogScheduled(l))}</p>
            <p class="small muted" style="margin:0.2rem 0 0">Realizada: ${escapeHtml(formatStamp(l.completionDate))}</p>
            <p class="small" style="margin:0.4rem 0 0">${statusBadge(l)}
              ${l.wasAssignedToHim === false ? `<span class="badge badge-amber">Chequeo cruzado</span>` : ""}</p>
            ${material ? `<p class="warn-box"><strong>⚠ Falta de material:</strong> ${escapeHtml(material)}</p>` : ""}
            ${l.comments ? `<p class="notes-box"><strong>Observaciones:</strong> ${escapeHtml(l.comments)}</p>` : ""}
          </article>`;
        })
        .join("");
    }

    subscribeMyLogs(
      profile.uid,
      (list) => {
        logs = list;
        render();
      },
      (e) => showError($("err"), e.message)
    );

    $("list").addEventListener("click", (e) => {
      const card = e.target.closest("[data-id]");
      if (!card) return;
      const l = logs.find((x) => x.id === card.dataset.id);
      if (!l) return;
      const material = String(l.materialShortage || "").trim();
      $("detBody").innerHTML = `
        <h2 class="h2">${escapeHtml(l.taskTitle || "")}</h2>
        <p class="small muted" style="margin:0">Programada: ${escapeHtml(formatLogScheduled(l))}</p>
        <p class="small muted" style="margin:0.2rem 0 0">Realizada: ${escapeHtml(formatStamp(l.completionDate))}</p>
        <p class="small" style="margin:0.5rem 0 0">${statusBadge(l)}
          ${l.wasAssignedToHim === false ? `<span class="badge badge-amber">Chequeo cruzado</span>` : ""}</p>
        ${l.taskDescription ? `<p class="small" style="margin:0.75rem 0 0">${escapeHtml(l.taskDescription)}</p>` : ""}
        ${material ? `<p class="warn-box"><strong>⚠ Falta de material:</strong> ${escapeHtml(material)}</p>` : ""}
        ${l.comments ? `<p class="notes-box"><strong>Observaciones:</strong> ${escapeHtml(l.comments)}</p>` : ""}
        <p class="small muted" style="margin:0.75rem 0 0">Asignada a: ${escapeHtml((l.assignedUsersList || []).map((u) => u.fullName).join(", ") || "—")}</p>
      `;
      $("detModal").hidden = false;
    });

    $("btnDetClose").onclick = () => ($("detModal").hidden = true);
    $("detModal").addEventListener("click", (e) => {
      if (e.target === $("detModal")) $("detModal").hidden = true;
    });
  </script>
</body>
</html>
